name: Close linked issues on develop merge

on:
  pull_request_target:
    branches:
      - develop
    types:
      - closed

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close issues referenced by closing keywords
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request?.body ?? "";
            const closingPattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)\b/gi;
            const issueNumbers = [...new Set(
              [...body.matchAll(closingPattern)].map((match) => Number(match[1]))
            )];

            if (issueNumbers.length === 0) {
              core.info("No closing issue references found in PR body.");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;

            for (const issue_number of issueNumbers) {
              const { data: issue } = await github.rest.issues.get({
                owner,
                repo,
                issue_number,
              });

              if (issue.pull_request) {
                core.info(`Skipping #${issue_number}: reference points to a pull request.`);
                continue;
              }

              if (issue.state !== "open") {
                core.info(`Skipping #${issue_number}: issue is already ${issue.state}.`);
                continue;
              }

              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                state: "closed",
                state_reason: "completed",
              });

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `Closed automatically because PR #${prNumber} was merged into \`develop\` with a closing reference.`,
              });

              core.info(`Closed issue #${issue_number}.`);
            }
