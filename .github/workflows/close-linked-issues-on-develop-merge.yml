name: Close linked issues on develop merge

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  close-linked-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Close issues referenced by merged PRs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const commitSha = context.sha;

            const { data: pullRequests } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: commitSha,
              });

            const mergedIntoDevelop = pullRequests.filter(
              (pr) => pr.merged_at && pr.base?.ref === "develop"
            );

            if (mergedIntoDevelop.length === 0) {
              core.info("No merged PR associated with this develop push.");
              return;
            }

            const closingPattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)\b/gi;

            for (const pr of mergedIntoDevelop) {
              const body = pr.body ?? "";
              const issueNumbers = [...new Set(
                [...body.matchAll(closingPattern)].map((match) => Number(match[1]))
              )];

              if (issueNumbers.length === 0) {
                core.info(`PR #${pr.number} has no closing issue references.`);
                continue;
              }

              for (const issue_number of issueNumbers) {
                const { data: issue } = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number,
                });

                if (issue.pull_request) {
                  core.info(`Skipping #${issue_number}: reference points to a pull request.`);
                  continue;
                }

                if (issue.state !== "open") {
                  core.info(`Skipping #${issue_number}: issue is already ${issue.state}.`);
                  continue;
                }

                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number,
                  state: "closed",
                  state_reason: "completed",
                });

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body: `Closed automatically because PR #${pr.number} was merged into \`develop\` with a closing reference.`,
                });

                core.info(`Closed issue #${issue_number} for PR #${pr.number}.`);
              }
            }
