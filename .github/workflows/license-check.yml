# SPDX-License-Identifier: Apache-2.0
name: License compliance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run license:check
      - run: npm run license:test
